<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidan finns inte – Nollkomma</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF0EC">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
/* Layout: en kolumn med 1200 px breda sektioner i kalkgrått; ett mörkt AI-band och ett ljusgrönt kontaktband bryter rytmen. En ljus look med flit. */
@font-face{font-family:"Familjen Grotesk";src:url(/assets/fonts/familjen-grotesk-latin-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Familjen Grotesk";src:url(/assets/fonts/familjen-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Familjen Grotesk";src:url(/assets/fonts/familjen-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --kalk:#EDF0EC; --papper:#FFFFFF; --svart:#15201E; --text-2:#33413E; --text-3:#4A5754; --text-tint:#2C3B38;
  --strom:#0B5A55; --strom-hover:#073F3B; --tint:#D3E4E0; --linje:#B9C4C0; --varn:#A8401F;
  --natt:#15201E; --natt-2:#0F1817; --natt-linje:#2B3A37; --natt-text:#C9D6D2; --kod:#E3ECE9; --kod-2:#9FB3AE; --kod-lank:#9FD3C9;
  --vit:#FFFFFF;
  --font:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:16px;background:var(--kalk)}
body{margin:0;background:var(--kalk);color:var(--svart);font-family:var(--font);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img,video{max-width:100%;height:auto;display:block}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:var(--strom)}
a:hover{color:var(--strom-hover)}
:focus-visible{outline:3px solid var(--strom);outline-offset:3px;border-radius:4px}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(clamp(20px,4vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(20px,4vw,32px),env(safe-area-inset-right,0px))}
.nowrap{white-space:nowrap}
.skip{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:-80px;z-index:10;background:var(--svart);color:var(--vit);padding:12px 18px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:12px;color:var(--vit)}

/* sidhuvud */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 28px;padding-block:20px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand a{color:var(--svart);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.brand a:hover{color:var(--strom)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--strom);color:var(--vit);font-weight:700;font-size:19px;letter-spacing:-.04em;line-height:1;padding-bottom:2px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:0 22px;font-size:17px}
.nav a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.nav a:not(.btn){color:var(--svart)}
.nav a:not(.btn):hover{color:var(--strom)}
@media (max-width:559px){.nav a:not(.btn){display:none}.top{flex-wrap:nowrap;gap:12px}.brand{font-size:20px}.nav .btn-sm{padding:0 16px;white-space:nowrap}}

/* knappar */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:999px;background:var(--strom);color:var(--vit);border:2px solid var(--strom);font-weight:600;font-size:18px;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{background:var(--strom-hover);border-color:var(--strom-hover);color:var(--vit)}
.btn-ghost{background:transparent;color:var(--svart);border-color:var(--svart)}
.btn-ghost:hover{background:var(--svart);border-color:var(--svart);color:var(--vit)}
.btn-sm{min-height:44px;padding:0 20px;font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* typografi */
h1{font-size:clamp(46px,8.4vw,92px);line-height:.96;letter-spacing:-.035em;font-weight:700}
h2{font-size:clamp(34px,5vw,52px);line-height:1.05;letter-spacing:-.025em;font-weight:700}
h3{font-size:22px;line-height:1.25;font-weight:700}

/* sidfot */
.foot{padding-block:32px 40px}
.foot p{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:16px;color:var(--text-3)}
.foot a{color:var(--text-3)}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}

.lost{padding-block:40px 120px;display:flex;flex-direction:column;gap:24px;max-width:760px}
.lost p{font-size:21px;color:var(--text-2)}
</style>
</head>
<body>
<header class="wrap top">
  <div class="brand"><span class="badge" aria-hidden="true">0,</span><a href="/">Nollkomma</a></div>
</header>
<main id="main" class="wrap lost">
  <h1>Sidan finns inte.</h1>
  <p>Den laddade i alla fall snabbt.</p>
  <p><a class="btn" href="/">Till startsidan</a></p>
</main>
</body>
</html>
